<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="900" height="400" fill="#fcfcfb"/>
<text x="30" y="44" font-size="23" font-weight="bold" fill="#0b0b0b">Why M4 is an actual cause</text>
<text x="30" y="70" font-size="14" fill="#52514e">Halpern-Pearl AC2 with witness set W = {empty}&#8194;&#8226;&#8194;degree of responsibility = 1.00</text>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#52514e"/></marker></defs>
<circle cx="110" cy="200" r="34" fill="#2a78d6" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="110" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="white">M4</text>
<circle cx="360" cy="200" r="34" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="360" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b0b0b">placer</text>
<circle cx="560" cy="200" r="34" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="560" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b0b0b">router</text>
<circle cx="770" cy="200" r="34" fill="#008300" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="770" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="white">DRC</text>
<line x1="145" y1="200" x2="322" y2="200" stroke="#52514e" stroke-width="2" marker-end="url(#a)" />
<line x1="396" y1="200" x2="522" y2="200" stroke="#52514e" stroke-width="2" marker-end="url(#a)" />
<line x1="596" y1="200" x2="733" y2="200" stroke="#52514e" stroke-width="2" marker-end="url(#a)" />
<text x="30" y="360" font-size="13.5" fill="#52514e">AC2(a): with W held at its witness setting and M4 where it is, the violation still occurs. AC2(b): move M4 alone and it does not. Everything downstream &#8212; the standard cells, the routes &#8212; is recomputed by the tool, which is what makes this a do() and not a perturbation.</text>
</svg>